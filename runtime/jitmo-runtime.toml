# jitmo-runtime v0.3 config. Every key is optional; the values below are the defaults unless
# marked "example". Relative paths are relative to this file. Reference: docs/06-runtime-api.md
#
# One model: the [model] table below. Several models (a pool): use [[models]] entries instead,
# each with the same keys plus name, kind ("chat" | "embedding"), pinned. See the docs.

[server]
host = "127.0.0.1"
port = 8090                # 0 = any free port (printed as JITMO_RUNTIME_LISTENING port=<n>)
max_queue = 8              # requests that may wait for a generation slot
max_concurrent = 1         # generations at the same time across all models (they share RAM bandwidth)

[model]
name = "jitmo-base"        # the model id clients send
kind = "chat"              # or "embedding" (llama-server --embeddings; POST /v1/embeddings)
pinned = false             # true = never evicted for another model, never idle-unloaded
path = 'V:\jitmo-sandbox\models\Qwen3-4B-Instruct-2507-Q4_K_M.gguf'
llama_server = 'V:\jitmo-sandbox\llama\llama-server.exe'
port = 0                   # private port of the llama-server child; 0 = any free port
ctx_size = 4096
threads = 0                # 0 = physical cores - 1, at most half the logical processors (3 on a 4c/8t CPU)
kv_cache_type = "f16"      # q8_0 saves ~267 MB at ctx 4096 on Qwen3-4B but read prompts slower in the baseline
flash_attn = "on"          # a quantized V cache needs flash attention on
mmap = true
no_repack = true           # no private repacked copy of the weights: ~half the RAM, ~20% slower
low_priority = true        # child runs at below-normal CPU priority
cache_ram_mb = 256         # llama-server prompt cache in RAM (--cache-ram); counted in the auto cap
ctx_checkpoints = 4        # SWA/hybrid context checkpoints per slot (--ctx-checkpoints); counted in the auto cap
# example: Qwen3-family templates read this; it turns "thinking" off. Unknown keys are ignored.
chat_template_kwargs = { enable_thinking = false }
adapters = []              # LoRA files loaded with the model (scale 0); requests pick them by id
extra_args = []
# log_file = "llama-server.log"   # default: llama-server.log (one model), llama-server-<name>.log (several)
load_timeout_secs = 180

[budget]
memory_cap_mb = "auto"     # Job Object commit (private bytes) cap on the child: "auto" = computed from
                           # the GGUF metadata and ctx (KV + state + buffers + caches + 640 MiB), a number = MiB, 0 = none.
                           # mmap'd weights are NOT counted: this bounds KV cache + buffers.
reserve_free_mb = 1536     # refuse to load if less than this would stay free
load_estimate_mb = 0       # 0 = estimate: private (KV + state + buffers + prompt cache + checkpoints + 96 MiB + 5% of
                           # the weights) + mapped file minus on-disk tensors (Gemma 3n PLE). Not the cap: no 640 MiB.
pool_budget_mb = 0         # total load estimate of loaded models; 0 = no limit (free-RAM check only)
pressure_free_mb = 1024    # below this twice in a row: finish the running generation, then unload
critical_free_mb = 500     # below this once: unload at once, even mid-generation; 0 = never
pressure_finish_max_ms = 15000 # under pressure, a generation may finish for at most this long; then (if RAM
                           # is still short) it is cancelled with a memory_pressure error and the model unloaded. 0 = no limit
idle_unload_secs = 90      # unload after this long without requests; 0 = never
watch_interval_ms = 1000

[pacer]                    # "don't freeze the PC": cap the models' CPU when other programs need it
mode = "auto"              # auto | always (heavy level all the time) | off
poll_ms = 300
smooth_ms = 1500           # other programs' CPU is averaged over this long
light_cpu_pct = 20.0       # other programs above this % of all logical CPUs: light level
heavy_cpu_pct = 40.0       # above this, or free RAM below low_free_mb: heavy level
low_free_mb = 0            # 0 = budget.pressure_free_mb
light_cap_pct = 75         # light level: the model gets this % of its normal CPU (Job Object hard cap)
heavy_cap_pct = 50         # heavy level
hysteresis_pct = 5.0       # to go down a level, CPU must be this many points under the threshold
release_after_ms = 5000    # a level holds at least this long before it goes down
heavy_hysteresis_pct = 10.0 # to leave heavy, CPU must be this many points under heavy_cpu_pct
heavy_release_after_ms = 10000 # heavy goes down only after CPU and RAM stayed clear of it this long in a row
busy_priority = "unchanged" # or "idle": also drop the children to idle priority while capped

# ---- example chain: works with no adapters ----
[[chains]]
name = "classify-answer"
description = "Decide what kind of message it is, then answer in a fitting style."

[[chains.steps]]
name = "classify"
system = """Classify the user's message as exactly one kind:
question = asks for information or an explanation
task = asks you to write, change or plan something
chat = greeting or small talk"""
input = "{input}"
max_tokens = 16
temperature = 0.0
json_schema = { type = "object", properties = { kind = { type = "string", enum = ["question", "task", "chat"] } }, required = ["kind"], additionalProperties = false }

[[chains.steps]]
name = "answer"
system = """You are a helpful assistant running on the user's own laptop.
The user's message is a {classify.kind}.
For a question: answer in at most three short sentences.
For a task: do it, briefly.
For chat: reply in one friendly sentence."""
input = "{input}"
max_tokens = 200
temperature = 0.3
# To use a LoRA adapter for a step:
# lora = { path = 'adapters/answer.gguf', scale = 1.0 }
